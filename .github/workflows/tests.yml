name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.deps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*']
        deps: ['highest']
        include:
          - php: '8.2'
            laravel: '11.*'
            deps: 'lowest'
          # Coverage row — runs once with xdebug enabled, uploads to Codecov.
          - php: '8.3'
            laravel: '12.*'
            deps: 'highest'
            coverage: true
        exclude:
          - php: '8.2'
            laravel: '12.*'

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage && 'xdebug' || 'none' }}
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.deps }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.deps }}-
            composer-${{ matrix.php }}-${{ matrix.laravel }}-
            composer-${{ matrix.php }}-

      - name: Pin Laravel version
        run: |
          composer require --no-update --dev \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:$( [ '${{ matrix.laravel }}' = '11.*' ] && echo '9.*' || echo '10.*' )"

      - name: Install dependencies
        run: |
          if [ "${{ matrix.deps }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --no-interaction --no-progress
          fi

      - name: Audit dependencies for known CVEs
        run: composer audit --no-dev --locked --abandoned=report
        continue-on-error: true

      - name: Lint PHP sources
        run: composer run lint

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: vendor/bin/pest --colors=always

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: vendor/bin/pest --colors=always --coverage --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: false
        continue-on-error: true
