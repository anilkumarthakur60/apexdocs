name: release

# Auto-create a GitHub Release whenever a SemVer tag is pushed.
#
# Workflow:
#   1. You: `git tag 0.2.0 && git push --tags`
#   2. This workflow extracts the corresponding section from CHANGELOG.md
#      (everything between `## [0.2.0]` and the next `## [` heading).
#   3. Publishes a GitHub Release using that content as the body.
#
# Packagist auto-update is handled separately by the GitHub → Packagist webhook
# configured once on the Packagist package settings page.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'        # 0.1.0
      - '[0-9]+.[0-9]+.[0-9]+-*'      # 0.1.0-beta1

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract changelog section for this tag
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if [ ! -f CHANGELOG.md ]; then
            echo "No CHANGELOG.md — release body will be empty." >&2
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            echo "Release $TAG" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pull lines from `## [$TAG]` (inclusive) up to but excluding the next `## [` heading.
          body=$(awk -v tag="$TAG" '
            $0 ~ "^## \\["tag"\\]" { found=1; next }
            found && /^## \[/      { exit }
            found                  { print }
          ' CHANGELOG.md)

          if [ -z "$body" ]; then
            body="Release $TAG"
          fi

          {
            echo "body<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
